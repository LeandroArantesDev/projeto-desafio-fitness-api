services:
  mysql:
    image: mysql:8.4
    container_name: pdf-java-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projeto_desafios_fitness
      MYSQL_USER: pdf_user
      MYSQL_PASSWORD: pdf123

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql

  tomcat:
    image: tomcat:10.1-jdk21
    container_name: pdf-java-tomcat

    ports:
      - "8080:8080"

    volumes:
      - ./deploy:/usr/local/tomcat/webapps

    depends_on:
      - mysql

volumes:
  mysql_data:
